name: deploy-to-docker-hub
on:
  push:
    tags:
      - '*'
jobs:
  buildx:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Default slim image: no optional extras.
          - suffix: ''
            extras: ''
          # Local ML tagging (ONNX Runtime + ffmpeg).
          - suffix: '-wd-tagger'
            extras: '--extra wd-tagger'
          # Local ML tagging with CUDA acceleration (large image; needs the
          # NVIDIA Container Toolkit on the host).
          - suffix: '-wd-tagger-cuda'
            extras: '--extra wd-tagger-cuda'
          # Pixiv metadata support.
          - suffix: '-pixiv'
            extras: '--extra pixiv'
          # Everything (CPU tagger; wd-tagger and wd-tagger-cuda conflict, so
          # --all-extras can't be used).
          - suffix: '-all'
            extras: '--extra wd-tagger --extra pixiv'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # The CUDA/cuDNN wheels make this image several GB; reclaim runner disk.
      - name: Free disk space
        if: matrix.suffix == '-wd-tagger-cuda'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            EXTRAS=${{ matrix.extras }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/szurubooru-toolkit:latest${{ matrix.suffix }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/szurubooru-toolkit:${{ github.ref_name }}${{ matrix.suffix }}
          platforms: linux/amd64
